name: nightly

# Pruebas largas que no caben en cada PR: fuzzing de los analizadores y la
# prueba de resistencia con kill -9. Un fallo aquí abre la investigación
# antes del siguiente release.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzzing largo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/chunked, fn: FuzzReader }
          - { pkg: ./internal/auth, fn: FuzzParseAuthorization }
          - { pkg: ./internal/s3api, fn: FuzzParseRange }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 15m
      - name: guardar la entrada que falló
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target.fn }}
          path: "**/testdata/fuzz/**"

  soak:
    name: resistencia con kill -9
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run ./test/soak -duration 15m -workers 16
