name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Cada lunes, aunque no haya commits: los clientes cambian sus valores por defecto.
    - cron: "17 11 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, formato y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod verify
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: fuzzing corto de los analizadores
        run: |
          go test ./internal/chunked -run '^$' -fuzz '^FuzzReader$' -fuzztime 30s
          go test ./internal/auth -run '^$' -fuzz '^FuzzParseAuthorization$' -fuzztime 30s
          go test ./internal/s3api -run '^$' -fuzz '^FuzzParseRange$' -fuzztime 30s

  supply-chain:
    name: vulnerabilidades y licencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: licencias de las dependencias
        run: >
          go run github.com/google/go-licenses/v2@v2.0.1 check ./...
          --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

  compat:
    name: compatibilidad con clientes reales
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: pip install --quiet boto3
      - run: aws --version
      - run: test/compat/run.sh
        env:
          COMPAT_REQUIRE_ALL: "1"

  image:
    name: imagen de contenedor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg VERSION=ci -t chuspa:ci .
      - name: arranca endurecida y atiende al AWS CLI
        env:
          AWS_ACCESS_KEY_ID: llave-de-ci
          AWS_DEFAULT_REGION: cali-san-antonio-1
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          export AWS_SECRET_ACCESS_KEY=$(openssl rand -hex 24)
          # Sin credenciales, la imagen no arranca.
          if docker run --rm chuspa:ci; then echo "arrancó sin credenciales"; exit 1; fi
          docker run -d --name chuspa --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:9000:9000 -e CHUSPA_ROOT_USER="$AWS_ACCESS_KEY_ID" -e CHUSPA_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" chuspa:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' chuspa)" = healthy ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' chuspa)" = healthy ] || { docker logs chuspa; exit 1; }
          [ "$(docker inspect -f '{{.Config.User}}' chuspa)" = "nonroot:nonroot" ]
          echo "oíste mira" > salsa.txt
          aws s3 mb s3://feria-de-cali
          aws s3 cp salsa.txt s3://feria-de-cali/salsa.txt
          aws s3 cp s3://feria-de-cali/salsa.txt bajado.txt
          cmp salsa.txt bajado.txt
          # Los datos sobreviven al reinicio del contenedor.
          docker restart chuspa
          sleep 2
          aws s3 cp s3://feria-de-cali/salsa.txt tras-reinicio.txt
          cmp salsa.txt tras-reinicio.txt
